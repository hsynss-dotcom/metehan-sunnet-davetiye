*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071a30}body{font-family:Georgia,"Times New Roman",serif}.page{max-width:640px;margin:auto;padding:10px 10px 22px}.card{background:#f7f0e3;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.4)}.card img{display:block;width:100%;height:auto}.panel{color:#f5ead8;text-align:center;padding:12px 8px 4px}.date{font-size:13px;letter-spacing:.2px}.count{font-weight:bold;margin-top:3px}.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}button{font:inherit;font-size:13px;color:#fff;background:#123d6d;border:1px solid #587da5;border-radius:30px;padding:10px 16px}.expired{display:none;color:#f5ead8;text-align:center;padding:55px 20px;font-size:18px;line-height:1.6}.expired b{display:block;font-size:25px;margin-bottom:8px}

<body>
<main class="page">
<section id="live">
<div class="card"><img src="davetiye.jpg" alt="Metehan'ın sünnet davetiyesi"></div>
<div class="panel"><div class="date">23 Ağustos 2026 • 20:00 • Palmiye Garden Kaynaklar</div><div class="count" id="count"></div><div class="buttons"><button onclick="shareInvite()">↗ Davetiyeyi Paylaş</button><button onclick="calendar()">＋ Takvime Ekle</button></div></div>
</section>
<section class="expired" id="expired"><b>Davetiyenin süresi doldu.</b>Elektronik davetiye 24 Ağustos 2026 tarihine kadar görüntülenmek üzere hazırlanmıştır.</section>
</main>
<script>
const expiry=new Date("2026-08-25T00:00:00+03:00").getTime();
function tick(){const left=expiry-Date.now(),el=document.getElementById("count");if(left<=0){document.getElementById("live").style.display="none";document.getElementById("expired").style.display="block";return}const d=Math.floor(left/86400000),h=Math.floor(left%86400000/3600000),m=Math.floor(left%3600000/60000),s=Math.floor(left%60000/1000);el.textContent=`Davetiyenin görüntülenmesine kalan süre: ${d} gün ${h} saat ${m} dk ${s} sn`}
setInterval(tick,1000);tick();
async function shareInvite(){const data={title:"Metehan'ın Sünnet Davetiyesi",text:"Metehan'ın sünnet davetiyesi • 23 Ağustos 2026 • 20:00 • Palmiye Garden Kaynaklar",url:location.href};if(navigator.share){try{await navigator.share(data)}catch(e){}}else{try{await navigator.clipboard.writeText(location.href);alert("Davetiyenin bağlantısı kopyalandı.")}catch(e){prompt("Davetiyenin bağlantısı:",location.href)}}}
function calendar(){const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Metehan Davetiye//TR","BEGIN:VEVENT","DTSTART;TZID=Europe/Istanbul:20260823T200000","DTEND;TZID=Europe/Istanbul:20260823T230000","SUMMARY:Metehan'ın Sünnet Daveti","LOCATION:Palmiye Garden Kaynaklar","DESCRIPTION:Metehan'ın sünnet daveti","END:VEVENT","END:VCALENDAR"].join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="Metehan-Sunnet-Daveti.ics";a.click()}
</script>
