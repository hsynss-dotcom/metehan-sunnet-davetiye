<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B2D55">
<title>Metehan'ın Sünnet Davetiyesi</title>
<meta name="description" content="23 Ağustos 2026 • 20:00 • Palmiye Garden Kaynaklar">
<meta property="og:title" content="Metehan'ın Sünnet Davetiyesi">
<meta property="og:description" content="23 Ağustos 2026 • 20:00 • Palmiye Garden Kaynaklar">
<meta property="og:image" content="davetiye.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="davetiye.jpg">
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1f38;font-family:Georgia,serif}
.wrap{max-width:640px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
img{width:100%;display:block}.info{text-align:center;color:#f5ead8;padding:14px}.count{font-weight:bold;margin:8px 0}
button{background:#123d6d;color:#fff;border:0;border-radius:28px;padding:10px 16px;margin:4px}
.expired{display:none;text-align:center;color:#fff;padding:50px 20px}
</style>
</head>
<body>
<div class="wrap" id="live">
<div class="card"><img src="davetiye.jpg" alt="Davetiye"></div>
<div class="info">
<div>23 Ağustos 2026 • 20:00</div>
<div>Palmiye Garden Kaynaklar</div>
<div class="count" id="count"></div>
<button onclick="shareInvite()">Davetiyeyi Paylaş</button>
<button onclick="calendar()">Takvime Ekle</button>
</div></div>
<div class="expired" id="expired"><h2>Davetiyenin süresi doldu</h2><p>24 Ağustos 2026 sonuna kadar görüntülenebilir.</p></div>
<script>
const end=new Date("2026-08-25T00:00:00+03:00").getTime();
function tick(){const l=end-Date.now();if(l<=0){live.style.display="none";expired.style.display="block";return;}const d=Math.floor(l/864e5),h=Math.floor(l%864e5/36e5),m=Math.floor(l%36e5/6e4);count.textContent=`${d} gün ${h} saat ${m} dakika kaldı`;};setInterval(tick,1000);tick();
async function shareInvite(){const data={title:"Metehan'ın Sünnet Davetiyesi",text:"23 Ağustos 2026 • Palmiye Garden",url:location.href};if(navigator.share) await navigator.share(data);else{navigator.clipboard.writeText(location.href);alert("Bağlantı kopyalandı");}}
function calendar(){const ics=["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT","DTSTART;TZID=Europe/Istanbul:20260823T200000","DTEND;TZID=Europe/Istanbul:20260823T230000","SUMMARY:Metehan'ın Sünnet Daveti","LOCATION:Palmiye Garden Kaynaklar","END:VEVENT","END:VCALENDAR"].join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="Metehan-Sunnet-Daveti.ics";a.click();}
</script></body></html>
